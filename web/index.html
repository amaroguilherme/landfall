<!doctype html>
<html lang="en" data-hds-palette="dark" style="background: #17171b; color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Offline-first guarantee: the browser itself refuses any request to another origin. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#17171b" />
    <meta
      name="description"
      content="LANDFALL: Earth-independent health navigation for exploration crews. Runs offline. NASA and NOAA data frozen at build; crew data simulated."
    />
    <!-- Link previews. Read by the services that fetch this page; the page itself requests nothing from them. og.png is
         a crop of the claim-checked hero still of scripts/video (make-figures.mjs re-cuts it) and is not precached. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LANDFALL" />
    <meta property="og:url" content="https://landfall.landfall-web.workers.dev/" />
    <meta property="og:title" content="LANDFALL · Earth-independent health navigation" />
    <meta property="og:description" content="Earth-independent health navigation for exploration crews. Runs offline. NASA and NOAA data frozen at build; crew data simulated." />
    <meta property="og:image" content="https://landfall.landfall-web.workers.dev/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="LANDFALL's Now view at a Mars surface base during a solar conjunction: with no link, Houston's earliest reply is days away, while LANDFALL's onboard guidance is already on screen. Simulated crew data." />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>LANDFALL · Earth-independent health navigation</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="color: #fff; font-family: sans-serif; padding: 1rem">
        LANDFALL runs entirely in your browser and needs JavaScript enabled. No data leaves this page.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
