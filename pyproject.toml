[project]
name = "landfall"
version = "0.1.0"
description = "LANDFALL: Earth-independent health navigation for exploration crews (NASA Space Apps 2026)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
# engine/ is deliberately stdlib-only so anyone can import it and check the arithmetic.
dependencies = []

[project.optional-dependencies]
ingest = [
    "httpx>=0.27",
    "pdfminer.six>=20240706",
    "beautifulsoup4>=4.12",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["engine/tests", "ingest/tests"]
